<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multi-Agent Research Lab | Comparison</title>
<style>
:root{--ink:#172b3a;--muted:#5c6c77;--line:#d9e2e7;--paper:#f4f7f8;--navy:#123047;--blue:#0b7285;--green:#087f5b;--red:#c92a2a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,sans-serif}header{background:var(--navy);color:#fff;padding:24px max(24px,calc((100% - 1180px)/2))}h1{margin:0;font-size:26px;letter-spacing:0}header p{margin:4px 0 0;color:#d7e3ea}main{max-width:1180px;margin:24px auto;padding:0 24px 42px}.panel,article{background:#fff;border:1px solid var(--line);border-radius:6px;padding:18px}label{display:block;font-weight:700;margin-bottom:6px}textarea,input,select{width:100%;border:1px solid #b9c7d0;border-radius:4px;padding:10px;font:inherit;background:#fff;color:var(--ink)}textarea{height:82px;resize:vertical}.controls{display:grid;grid-template-columns:1fr 150px 150px auto;gap:12px;align-items:end;margin-top:12px}.check{display:flex;gap:7px;align-items:center;padding:10px 0;font-weight:500}.check input{width:auto}button{background:var(--blue);color:white;border:0;border-radius:4px;padding:11px 18px;font:inherit;font-weight:750;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.status{min-height:24px;margin:16px 0;color:var(--muted)}.hidden{display:none}.provenance{border-left:4px solid var(--blue);background:#edf7f8;padding:12px 14px;margin-bottom:16px}.provenance strong{display:block}.comparison{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}.comparison th,.comparison td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.comparison th{background:#edf3f5}.comparison td:nth-child(2){font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}article h2{font-size:18px;margin:0 0 9px}.answer{white-space:pre-wrap;max-height:360px;overflow:auto}.route{display:flex;flex-wrap:wrap;gap:6px}.route span{background:#e6f4ea;color:#17663e;padding:4px 8px;border-radius:4px;font-weight:700}.source{padding:9px 0;border-top:1px solid var(--line)}.source a{color:#075e6e;word-break:break-word}.source small{color:var(--muted)}details{border-top:1px solid var(--line);padding:9px 0}summary{cursor:pointer;font-weight:700}pre{overflow:auto;background:#102a43;color:#e6f4ea;padding:12px;border-radius:4px;font-size:12px}.error{color:var(--red);font-weight:700}@media(max-width:760px){.controls,.grid{grid-template-columns:1fr}.comparison{font-size:13px}button{width:100%}}
</style></head><body><header><h1>Multi-Agent Research Lab</h1><p>Controlled experiment: single-agent baseline vs. Supervisor + Researcher + Analyst + Writer + Critic</p></header><main>
<div class="panel"><label for="query">Research question</label><textarea id="query">Explain the practical trade-offs of GraphRAG for an engineering team.</textarea><div class="controls"><div><label for="engine">Multi-agent engine</label><select id="engine"><option value="auto">Auto (LangGraph)</option><option value="langgraph">LangGraph</option><option value="sequential">Sequential</option></select></div><div><label for="sources">Max sources</label><input id="sources" type="number" min="1" max="20" value="5"></div><label class="check"><input id="critic" type="checkbox" checked> Critic review</label><button id="run">Compare runs</button></div></div>
<p id="status" class="status">Ready. Both runs use the providers configured in <code>.env</code>.</p><div id="result" class="hidden"><div id="provenance" class="provenance"></div><table class="comparison"><thead><tr><th>Metric</th><th>Single-agent baseline</th><th>Multi-agent workflow</th></tr></thead><tbody id="metrics"></tbody></table><div class="grid"><article id="baseline-card"></article><article id="multi-card"></article></div></div></main>
<script>
const $=id=>document.getElementById(id),run=$('run'),status=$('status');const esc=x=>String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const metric=(label,a,b)=>`<tr><th>${label}</th><td>${a}</td><td>${b}</td></tr>`;
function fmt(r){const s=r.state,u=s.usage;return{status:s.status,latency:`${r.latency_seconds}s`,calls:u.llm_calls,tokens:u.input_tokens+u.output_tokens,cost:`$${u.cost_usd.toFixed(5)}`,quality:`${r.quality.score}/10`,citations:`${Math.round(r.citation_coverage*100)}%`,sources:s.sources.length}}
function card(title,r,multi){const s=r.state;const route=s.route_history.map(x=>`<span>${esc(x)}</span>`).join('');const source=s.sources.length?`<h3>Data provenance</h3>${s.sources.map(x=>`<div class="source"><b>${esc(x.ref)} ${esc(x.title)}</b><br><a href="${esc(x.url)}" target="_blank" rel="noreferrer">${esc(x.url||'No URL')}</a><br><small>Provider: ${esc(x.metadata.provider||'unknown')} | score: ${esc(x.score)}</small><br>${esc(x.snippet)}</div>`).join('')}`:`<h3>Data provenance</h3><p>${esc(r.provenance)}</p>`;return`<h2>${title}</h2><p>${esc(r.provenance)}</p>${multi?`<h3>Route</h3><div class="route">${route}</div>`:''}<h3>Answer</h3><div class="answer">${esc(s.final_answer||'No answer')}</div>${source}<h3>Trace</h3>${s.trace.map((e,i)=>`<details ${i===0?'open':''}><summary>${i+1}. ${esc(e.name)}</summary><pre>${esc(JSON.stringify(e.payload,null,2))}</pre></details>`).join('')}`}
run.onclick=async()=>{run.disabled=true;$('result').classList.add('hidden');status.className='status';status.textContent='Running single-agent baseline, then multi-agent workflow...';try{const r=await fetch('/api/compare',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:$('query').value,engine:$('engine').value,max_sources:+$('sources').value,critic:$('critic').checked})}),d=await r.json();if(!r.ok)throw Error(d.error);const a=fmt(d.baseline),b=fmt(d.multi_agent);$('provenance').innerHTML=`<strong>Data provenance</strong>LLM provider configured: <b>${esc(d.llm_provider)}</b>. Search provider configured: <b>${esc(d.search_provider)}</b>. The baseline has no retrieval by design. Each multi-agent source below shows the provider actually returned by the run; <b>mock</b> means the curated offline corpus in <code>src/multi_agent_research_lab/services/mock_corpus.py</code>, not live web data.`;$('metrics').innerHTML=[metric('Status',a.status,b.status),metric('Latency',a.latency,b.latency),metric('LLM calls',a.calls,b.calls),metric('Tokens',a.tokens,b.tokens),metric('Estimated cost',a.cost,b.cost),metric('Heuristic quality',a.quality,b.quality),metric('Citation coverage',a.citations,b.citations),metric('Retrieved sources',a.sources,b.sources)].join('');$('baseline-card').innerHTML=card('Single-agent baseline',d.baseline,false);$('multi-card').innerHTML=card('Multi-agent workflow',d.multi_agent,true);status.textContent='Completed. Read data provenance before interpreting the quality and citation comparison.';$('result').classList.remove('hidden')}catch(e){status.textContent=e.message;status.className='status error'}finally{run.disabled=false}};
</script></body></html>
