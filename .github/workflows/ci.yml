name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # the llm extra brings langgraph, so CI exercises the real graph engine too
        run: pip install -e ".[dev,llm]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Type check
        run: mypy src tests

      - name: Tests
        run: pytest

      - name: No student TODOs left in src
        run: |
          if grep -R "TODO(student)" -n src; then
            echo "::error::src still contains TODO(student) markers"
            exit 1
          fi

      - name: Benchmark smoke run (offline mocks)
        run: python -m multi_agent_research_lab.cli benchmark --output reports/ci_benchmark.md
